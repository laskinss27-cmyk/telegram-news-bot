[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-news-bot"
version = "0.1.0"
description = "RSS news collector that publishes image-and-text posts to Telegram"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "feedparser>=6.0,<7",
    "PyYAML>=6.0,<7",
    "requests>=2.32,<3",
]

[project.scripts]
news-bot = "newsbot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
