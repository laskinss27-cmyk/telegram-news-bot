name: Telegram news moderation

on:
  schedule:
    # Сбор новых материалов раз в час. GitHub использует UTC.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Режим ручного запуска"
        required: true
        default: "check"
        type: choice
        options:
          - "check"
          - "discover"
          - "collect"

concurrency:
  group: telegram-news-moderation
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  moderation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install bot
        run: pip install .

      - name: Collect news or process moderation
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MODERATION_CHAT_ID: ${{ secrets.TELEGRAM_MODERATION_CHAT_ID }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.mode }}" = "discover" ]; then
            news-bot --config config.yaml --discover-chats
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.mode }}" = "check" ]; then
            news-bot --config config.yaml --check
          else
            news-bot --config config.yaml --queue
          fi

      - name: Save bot state
        if: always() && (github.event_name == 'schedule' || inputs.mode == 'collect')
        run: |
          if git diff --quiet -- data/state.json data/moderation.json; then
            echo "No state changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json data/moderation.json
          git commit -m "chore: update Telegram moderation state [skip ci]"
          git push
