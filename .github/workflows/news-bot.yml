name: Publish Telegram news

on:
  schedule:
    # Каждый час на 17-й минуте. GitHub использует UTC.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Режим ручного запуска"
        required: true
        default: "check"
        type: choice
        options:
          - "check"
          - "publish"

concurrency:
  group: telegram-news-publisher
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install bot
        run: pip install .

      - name: Check or publish
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.mode }}" = "check" ]; then
            news-bot --config config.yaml --check
          else
            news-bot --config config.yaml
          fi

      - name: Save publication history
        if: github.event_name == 'schedule' || inputs.mode == 'publish'
        run: |
          if git diff --quiet -- data/state.json; then
            echo "No state changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          git commit -m "chore: update published news state [skip ci]"
          git push
